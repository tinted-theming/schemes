system: "base16"
name: "Catppuccin Latte"
author: "https://github.com/catppuccin/catppuccin"
description: "Latte flavor, based on https://catppuccin.com/palette/"
variant: "light"
palette:
  base00: "#eff1f5"  # Default Background  # Catppuccin Base
  base01: "#e6e9ef"  # Darker Background (Used for status bars, line number and folding marks) # Catppuccin Mantle / AnsiBlack
  base02: "#bcc0cc"  # Selection Background (Bright Black) # Catppuccin Surface 1
  base03: "#9ca0b0"  # Comments, Invisibles, Line Highlighting (Grey) # Catppuccin Overlay 0 / AnsiBrightBlack
  base04: "#6c6f85"  # Dark/Light Foreground (Used for status bars) # Catppuccin Subtext 0
  base05: "#4c4f69"  # Default Foreground, Caret, Delimiters, Operators (Foreground) # Catppuccin Text / AnsiWhite
  base06: "#3d3f54"  # Dark Foreground (Not often used) (White) # NOT a Catppuccin color! Derived from Text
  base07: "#2f3141"  # Dark Background (Not often used) (Bright White) # NOT a Catppuccin color! Derived from Text
  # ANSI8 (without Black/White) + 2 (Orange + Dark Red/Brown)
  base08: "#d20f39"  # Red # Catppuccin Red
  base09: "#fe640b"  # Orange # Catppuccin Peach
  base0A: "#df8e1d"  # Yellow # Catppuccin Yellow
  base0B: "#40a02b"  # Green # Catppuccin Green
  base0C: "#179299"  # Aqua / Cyan # Catppuccin Teal
  base0D: "#1e66f5"  # Blue # Catppuccin Blue
  base0E: "#8839ef"  # Purple / Magenta # Catppuccin Mauve
  base0F: "#e64553"  # Dark Red or Brown # Catppuccin Maroon, the palette's second red
