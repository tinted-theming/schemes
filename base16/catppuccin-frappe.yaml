system: "base16"
name: "Catppuccin Frappe"
author: "https://github.com/catppuccin/catppuccin"
description: "Frappe flavor, based on https://catppuccin.com/palette/"
variant: "dark"
palette:
  base00: "#303446"  # Default Background  # Catppuccin Base
  base01: "#292c3c"  # Darker Background (Darkest Gray) (Used for status bars, line number and folding marks) # Catppuccin Mantle / AnsiBlack
  base02: "#51576d"  # Selection Background (Bright Black) # Catppuccin Surface 1
  base03: "#737994"  # Comments, Invisibles, Line Highlighting (Grey) # Catppuccin Overlay 0 / AnsiBrightBlack
  base04: "#a5adce"  # Dark/Light Foreground (Used for status bars) (Light Grey) # Catppuccin Subtext 0
  base05: "#c6d0f5"  # Default Foreground, Caret, Delimiters, Operators (Foreground) # Catppuccin Text / AnsiWhite
  base06: "#f2d5cf"  # Light Foreground (Not often used) (White) # Catppuccin Rosewater
  base07: "#ffffff"  # Light Background (Not often used) (Bright White) # NOT a Catppuccin color!
  # ANSI8 (without Black/White) + 2 (Orange + Dark Red/Brown)
  base08: "#e78284"  # Red # Catppuccin Red
  base09: "#ef9f76"  # Orange # Catppuccin Peach
  base0A: "#e5c890"  # Yellow # Catppuccin Yellow
  base0B: "#a6d189"  # Green # Catppuccin Green
  base0C: "#81c8be"  # Aqua / Cyan # Catppuccin Teal
  base0D: "#8caaee"  # Blue # Catppuccin Blue
  base0E: "#ca9ee6"  # Purple / Magenta # Catppuccin Mauve
  base0F: "#ea999c"  # Dark Red or Brown # Catppuccin Maroon, the palette's second red
