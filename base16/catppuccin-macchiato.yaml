system: "base16"
name: "Catppuccin Macchiato"
author: "https://github.com/catppuccin/catppuccin"
description: "Macchiato flavor, based on https://catppuccin.com/palette/"
variant: "dark"
palette:
  base00: "#24273a"  # Default Background  # Catppuccin Base
  base01: "#1e2030"  # Darker Background (Darkest Gray) (Used for status bars, line number and folding marks) # Catppuccin Mantle / AnsiBlack
  base02: "#494d64"  # Selection Background (Bright Black) # Catppuccin Surface 1
  base03: "#6e738d"  # Comments, Invisibles, Line Highlighting (Grey) # Catppuccin Overlay 0 / AnsiBrightBlack
  base04: "#a5adcb"  # Dark/Light Foreground (Used for status bars) (Light Grey) # Catppuccin Subtext 0
  base05: "#cad3f5"  # Default Foreground, Caret, Delimiters, Operators (Foreground) # Catppuccin Text / AnsiWhite
  base06: "#f4dbd6"  # Light Foreground (Not often used) (White) # Catppuccin Rosewater
  base07: "#ffffff"  # Light Background (Not often used) (Bright White) # NOT a Catppuccin color!
  # ANSI8 (without Black/White) + 2 (Orange + Dark Red/Brown)
  base08: "#ed8796"  # Red # Catppuccin Red
  base09: "#f5a97f"  # Orange # Catppuccin Peach
  base0A: "#eed49f"  # Yellow # Catppuccin Yellow
  base0B: "#a6da95"  # Green # Catppuccin Green
  base0C: "#8bd5ca"  # Aqua / Cyan # Catppuccin Teal
  base0D: "#8aadf4"  # Blue # Catppuccin Blue
  base0E: "#c6a0f6"  # Purple / Magenta # Catppuccin Mauve
  base0F: "#ee99a0"  # Dark Red or Brown # Catppuccin Maroon, the palette's second red
