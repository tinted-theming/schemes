system: "base24"
name: "MS-DOS Editor"
author: "Based on MS-DOS Editor (edit.com) VGA color palette"
variant: "dark"
palette:
  base00: "#0000aa" # VGA Blue - background
  base01: "#000084" # Darker blue variant
  base02: "#082050" # Line highlight
  base03: "#555555" # VGA Dark Gray - comments
  base04: "#aaaaaa" # VGA Light Gray
  base05: "#ffffff" # VGA White - main text
  base06: "#ffffff" # VGA White
  base07: "#ffffff" # VGA White
  base08: "#aa0000" # VGA Red - errors
  base09: "#aa5500" # VGA Brown - deprecated/special
  base0A: "#ffff55" # VGA Yellow - strings/warnings
  base0B: "#00aa00" # VGA Green - strings/success
  base0C: "#00aaaa" # VGA Cyan - regex/escape
  base0D: "#5555ff" # VGA Light Blue - functions
  base0E: "#aa00aa" # VGA Magenta - keywords
  base0F: "#ff5555" # VGA Light Red - special
  base10: "#000000" # VGA Black
  base11: "#000055" # Darker blue background
  base12: "#ff5555" # VGA Light Red - bright variant
  base13: "#ffff55" # VGA Yellow - bright variant
  base14: "#55ff55" # VGA Light Green - bright variant
  base15: "#55ffff" # VGA Light Cyan - bright variant
  base16: "#5555ff" # VGA Light Blue - bright variant
  base17: "#ff55ff" # VGA Light Magenta - bright variant
